name: CI/CD - Lambda + API Gateway (auth via CPF)

on:
  push:
    branches: [main, homologacao]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  AWS_REGION: us-west-2

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build e Testes
        run: mvn clean verify

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: auth-jar
          path: target/tc-oficina-lambda.jar

  docker-build:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        env:
          ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
        run: |
          aws ecr get-login-password --region "${{ env.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "$ECR_REPOSITORY_URL"

      - name: Build e Push da Imagem Auth
        env:
          ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          IMAGE_TAG="auth-${GITHUB_SHA}"
          docker build \
            --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --build-arg COMMIT_SHA="${GITHUB_SHA}" \
            -t "${ECR_REPOSITORY_URL}:${IMAGE_TAG}" .
          docker push "${ECR_REPOSITORY_URL}:${IMAGE_TAG}"

  deploy-lambda:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/homologacao')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build maven (jar shaded)
        run: mvn clean package -DskipTests

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Empacotar SAM (jar -> S3)
        env:
          STACK_NAME: tc-oficina-auth
        run: |
          STACK_SUFFIX=""
          if [ "${{ github.ref }}" = "refs/heads/homologacao" ]; then STACK_SUFFIX="-homolog"; fi
          echo "STACK_FULL=${STACK_NAME}${STACK_SUFFIX}" >> "$GITHUB_ENV"
          aws cloudformation package \
            --template-file template.yaml \
            --s3-bucket tc-oficina-sam-artifacts \
            --output-template-file packaged.yaml \
            --region "${{ env.AWS_REGION }}"

      - name: Deploy Lambda + API Gateway (SAM/CloudFormation)
        env:
          STACK_NAME: tc-oficina-auth
          VPC_ID: ${{ vars.VPC_ID }}
          SUBNET_A: ${{ vars.SUBNET_A }}
          SUBNET_B: ${{ vars.SUBNET_B }}
          LAMBDA_ROLE_ARN: ${{ vars.LAMBDA_ROLE_ARN }}
        run: |
          STACK_SUFFIX=""
          if [ "${{ github.ref }}" = "refs/heads/homologacao" ]; then STACK_SUFFIX="-homolog"; fi
          aws cloudformation deploy \
            --template-file packaged.yaml \
            --stack-name "${STACK_NAME}${STACK_SUFFIX}" \
            --region "${{ env.AWS_REGION }}" \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              DbUrl="${{ secrets.DB_URL }}" \
              DbUser="${{ secrets.DB_USER }}" \
              DbPassword="${{ secrets.DB_PASSWORD }}" \
              JwtSecret="${{ secrets.JWT_SECRET }}" \
              VpcId="${{ vars.VPC_ID }}" \
              SubnetA="${{ vars.SUBNET_A }}" \
              SubnetB="${{ vars.SUBNET_B }}" \
              LambdaRoleArn="${{ vars.LAMBDA_ROLE_ARN }}"

      - name: Smoke Test (POST /auth via API Gateway)
        run: |
          URL=$(aws cloudformation describe-stacks \
            --stack-name "${{ env.STACK_FULL }}" \
            --region "${{ env.AWS_REGION }}" \
            --query "Stacks[0].Outputs[?OutputKey=='AuthApiEndpoint'].OutputValue" \
            --output text)
          echo "Endpoint: $URL"
          CODE=""
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /tmp/auth_resp.json -w "%{http_code}" -X POST "$URL" \
              -H "Content-Type: application/json" \
              -d '{"cpf":"12345678909"}')
            echo "tentativa $i -> HTTP $CODE: $(cat /tmp/auth_resp.json)"
            if [ "$CODE" = "200" ]; then
              echo "Smoke test OK"
              exit 0
            fi
            sleep 10
          done
          echo "Smoke test falhou (esperado 200 para CPF cadastrado na base)"
          exit 1

  deploy-homologacao:
    if: github.event_name == 'push' && github.ref == 'refs/heads/homologacao'
    needs: docker-build
    runs-on: ubuntu-latest
    environment: homologacao

    env:
      NAMESPACE: tc-oficina-homolog
      NODE_PORT_AUTH: "30083"
      AUTH_IMAGE: ${{ vars.ECR_REPOSITORY_URL }}:auth-${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar chave SSH do cluster k3s
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.K3S_SSH_KEY }}" > ~/.ssh/k3s
          chmod 600 ~/.ssh/k3s
          ssh-keyscan -H "${{ vars.K3S_SERVER_IP }}" > /dev/null 2>&1 || true

      - name: Obter Manifestos (tc-oficina-infra-k8s)
        uses: actions/checkout@v4
        with:
          repository: rtmaraujo/tc-oficina-infra-k8s
          path: infra-k8s

      - name: Atualizar secret regcred (token ECR)
        env:
          ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
          K3S_HOST: ${{ vars.K3S_SERVER_IP }}
          NAMESPACE: ${{ env.NAMESPACE }}
        run: |
          ssh -i ~/.ssh/k3s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ubuntu@"$K3S_HOST" "sudo k3s kubectl create namespace $NAMESPACE --dry-run=client -o yaml | sudo k3s kubectl apply -f -"
          TOKEN=$(aws ecr get-login-password --region "${{ env.AWS_REGION }}")
          SERVER=$(echo "$ECR_REPOSITORY_URL" | cut -d/ -f1)
          AUTH=$(printf 'AWS:%s' "$TOKEN" | base64 -w0)
          SECRET_YAML=$(cat <<EOF
          apiVersion: v1
          kind: Secret
          metadata:
            name: regcred
            namespace: $NAMESPACE
          type: kubernetes.io/dockerconfigjson
          data:
            .dockerconfigjson: $(printf '{"auths":{"%s":{"username":"AWS","password":"%s","auth":"%s"}}}' "$SERVER" "$TOKEN" "$AUTH" | base64 -w0)
          EOF
          )
          echo "$SECRET_YAML" | ssh -i ~/.ssh/k3s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ubuntu@"$K3S_HOST" "sudo k3s kubectl apply -f -"

      - name: Renderizar e Aplicar Manifestos Auth (homologacao)
        env:
          NAMESPACE: ${{ env.NAMESPACE }}
          NODE_PORT_AUTH: ${{ env.NODE_PORT_AUTH }}
          AUTH_IMAGE: ${{ env.AUTH_IMAGE }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NEW_RELIC_APP_NAME_AUTH: tc-oficina-auth-homolog
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          K3S_HOST: ${{ vars.K3S_SERVER_IP }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gettext-base
          mkdir -p rendered
          envsubst < infra-k8s/k8s/namespace.yaml > rendered/namespace.yaml
          for f in infra-k8s/k8s/auth-*.yaml; do
            envsubst < "$f" > "rendered/$(basename "$f")"
          done
          ssh -i ~/.ssh/k3s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ubuntu@"$K3S_HOST" "sudo k3s kubectl apply -f -" < rendered/namespace.yaml
          for f in rendered/auth-*.yaml; do
            ssh -i ~/.ssh/k3s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              ubuntu@"$K3S_HOST" "sudo k3s kubectl apply -f -" < "$f" || exit 1
          done

      - name: Aguardar Rollout
        run: |
          ssh -i ~/.ssh/k3s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ubuntu@"${{ vars.K3S_SERVER_IP }}" "sudo k3s kubectl rollout status deployment/auth-deployment -n ${{ env.NAMESPACE }} --timeout=300s"
          ssh -i ~/.ssh/k3s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ubuntu@"${{ vars.K3S_SERVER_IP }}" "sudo k3s kubectl get pods -n ${{ env.NAMESPACE }}"

      - name: Smoke Test (healthcheck auth)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "http://${{ vars.K3S_SERVER_IP }}:${{ env.NODE_PORT_AUTH }}/health"; then
              echo ""
              echo "Healthcheck OK (auth homologacao)"
              exit 0
            fi
            sleep 5
          done
          echo "Healthcheck falhou em auth homologacao"
          exit 1

  deploy-producao:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker-build
    runs-on: ubuntu-latest
    environment: producao

    env:
      NAMESPACE: tc-oficina
      NODE_PORT_AUTH: "30082"
      AUTH_IMAGE: ${{ vars.ECR_REPOSITORY_URL }}:auth-${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar chave SSH do cluster k3s
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.K3S_SSH_KEY }}" > ~/.ssh/k3s
          chmod 600 ~/.ssh/k3s
          ssh-keyscan -H "${{ vars.K3S_SERVER_IP }}" > /dev/null 2>&1 || true

      - name: Obter Manifestos (tc-oficina-infra-k8s)
        uses: actions/checkout@v4
        with:
          repository: rtmaraujo/tc-oficina-infra-k8s
          path: infra-k8s

      - name: Atualizar secret regcred (token ECR)
        env:
          ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
          K3S_HOST: ${{ vars.K3S_SERVER_IP }}
          NAMESPACE: ${{ env.NAMESPACE }}
        run: |
          ssh -i ~/.ssh/k3s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ubuntu@"$K3S_HOST" "sudo k3s kubectl create namespace $NAMESPACE --dry-run=client -o yaml | sudo k3s kubectl apply -f -"
          TOKEN=$(aws ecr get-login-password --region "${{ env.AWS_REGION }}")
          SERVER=$(echo "$ECR_REPOSITORY_URL" | cut -d/ -f1)
          AUTH=$(printf 'AWS:%s' "$TOKEN" | base64 -w0)
          SECRET_YAML=$(cat <<EOF
          apiVersion: v1
          kind: Secret
          metadata:
            name: regcred
            namespace: $NAMESPACE
          type: kubernetes.io/dockerconfigjson
          data:
            .dockerconfigjson: $(printf '{"auths":{"%s":{"username":"AWS","password":"%s","auth":"%s"}}}' "$SERVER" "$TOKEN" "$AUTH" | base64 -w0)
          EOF
          )
          echo "$SECRET_YAML" | ssh -i ~/.ssh/k3s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ubuntu@"$K3S_HOST" "sudo k3s kubectl apply -f -"

      - name: Renderizar e Aplicar Manifestos Auth (producao)
        env:
          NAMESPACE: ${{ env.NAMESPACE }}
          NODE_PORT_AUTH: ${{ env.NODE_PORT_AUTH }}
          AUTH_IMAGE: ${{ env.AUTH_IMAGE }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NEW_RELIC_APP_NAME_AUTH: tc-oficina-auth
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          K3S_HOST: ${{ vars.K3S_SERVER_IP }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gettext-base
          mkdir -p rendered
          envsubst < infra-k8s/k8s/namespace.yaml > rendered/namespace.yaml
          for f in infra-k8s/k8s/auth-*.yaml; do
            envsubst < "$f" > "rendered/$(basename "$f")"
          done
          ssh -i ~/.ssh/k3s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ubuntu@"$K3S_HOST" "sudo k3s kubectl apply -f -" < rendered/namespace.yaml
          for f in rendered/auth-*.yaml; do
            ssh -i ~/.ssh/k3s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              ubuntu@"$K3S_HOST" "sudo k3s kubectl apply -f -" < "$f" || exit 1
          done

      - name: Aguardar Rollout
        run: |
          ssh -i ~/.ssh/k3s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ubuntu@"${{ vars.K3S_SERVER_IP }}" "sudo k3s kubectl rollout status deployment/auth-deployment -n ${{ env.NAMESPACE }} --timeout=300s"
          ssh -i ~/.ssh/k3s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ubuntu@"${{ vars.K3S_SERVER_IP }}" "sudo k3s kubectl get pods -n ${{ env.NAMESPACE }}"

      - name: Smoke Test (healthcheck auth)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "http://${{ vars.K3S_SERVER_IP }}:${{ env.NODE_PORT_AUTH }}/health"; then
              echo ""
              echo "Healthcheck OK (auth producao)"
              exit 0
            fi
            sleep 5
          done
          echo "Healthcheck falhou em auth producao"
          exit 1